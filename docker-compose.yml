services:
  postgres:
    image: postgres:18-alpine
    container_name: devolib-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devolib}
      POSTGRES_USER: ${POSTGRES_USER:-devolib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devolib}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      # PostgreSQL 18 stores data in a version-specific subdirectory here.
      - devolib_postgres_data:/var/lib/postgresql

  traefik:
    image: traefik:v2.10
    container_name: devolib-traefik
    ports:
      - "80:80"
      - "8080:8080"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
networks:
  web:
    name: web

volumes:
  devolib_postgres_data:
